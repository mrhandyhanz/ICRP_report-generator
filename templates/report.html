<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapReport — Student Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        /* Report viewer specific styles */
        .report-toolbar {
            background: var(--color-navy);
            padding: var(--space-3) var(--space-8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .toolbar-left img {
            height: 28px;
        }
        .toolbar-left h1 {
            font-size: var(--text-lg);
            color: white;
            font-weight: var(--weight-semibold);
        }
        .toolbar-right {
            display: flex;
            gap: var(--space-3);
        }
        .meta-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-3) var(--space-8);
            display: flex;
            gap: var(--space-6);
            flex-wrap: wrap;
        }
        .meta-item {
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
        }
        .meta-item strong {
            color: var(--color-text-primary);
        }
        .report-nav {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 var(--space-8);
            display: flex;
            gap: var(--space-1);
            overflow-x: auto;
        }
        .nav-btn {
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-sm);
            border: none;
            background: transparent;
            cursor: pointer;
            white-space: nowrap;
            color: var(--color-text-muted);
            border-bottom: 2px solid transparent;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }
        .nav-btn:hover { color: var(--color-text-primary); }
        .nav-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            font-weight: var(--weight-medium);
        }
        .reports-wrapper {
            padding: var(--space-10) var(--space-8);
            max-width: 900px;
            margin: 0 auto;
        }
        .report-card {
            background: white;
            border: 1px solid var(--color-border);
            margin-bottom: var(--space-10);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            page-break-after: always;
        }
        .report-accent {
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-insight));
        }
        .report-header {
            padding: var(--space-8);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            border-bottom: 1px solid var(--color-border);
        }
        .school-info h2 {
            font-size: var(--text-3xl);
            letter-spacing: -0.01em;
        }
        .school-info p {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: var(--space-1);
        }
        .report-badge {
            background: var(--color-primary);
            color: white;
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .student-section {
            padding: var(--space-6) var(--space-8);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-bottom: 1px solid var(--color-border);
        }
        .info-block { padding-right: var(--space-8); }
        .info-block:last-child {
            padding-right: 0;
            border-left: 1px solid var(--color-border);
            padding-left: var(--space-8);
        }
        .info-row {
            display: flex;
            align-items: baseline;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }
        .info-label {
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            min-width: 90px;
        }
        .info-value {
            font-size: var(--text-base);
            font-weight: var(--weight-medium);
        }
        .reg-mono {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            background: var(--color-surface-hover);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
        }
        .scores-section {
            padding: var(--space-6) var(--space-8);
            border-bottom: 1px solid var(--color-border);
        }
        .section-title {
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-primary);
            font-weight: var(--weight-semibold);
            margin-bottom: var(--space-4);
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-4);
        }
        .scores-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .scores-grid.cols-1 { grid-template-columns: 1fr; }
        .score-box {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .score-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .score-box.score-field-0::before { background: var(--color-insight); }
        .score-box.score-field-1::before { background: var(--color-success); }
        .score-box.score-field-2::before { background: var(--color-primary); }
        .score-box.score-field-3::before { background: #F59E0B; }
        .score-box.score-field-4::before { background: #8B5CF6; }
        .score-box.score-total::before { background: var(--color-primary); }
        .score-label {
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            margin-bottom: var(--space-2);
        }
        .score-value {
            font-size: var(--text-4xl);
            font-weight: var(--weight-bold);
            line-height: 1;
        }
        .score-box.score-total .score-value { color: var(--color-primary); }
        .score-sub {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            margin-top: var(--space-1);
        }
        .grade-row {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-top: var(--space-4);
        }
        .grade-pill {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
        }
        .grade-A-plus { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #166534; }
        .grade-A { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #166534; }
        .grade-B { background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.3); color: #1e40af; }
        .grade-C { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; }
        .grade-D { background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.3); color: #9a3412; }
        .grade-F { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #991b1b; }
        .progress-track {
            height: 6px;
            background: var(--color-border);
            border-radius: var(--radius-full);
            margin-top: var(--space-4);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: var(--radius-full);
            background: linear-gradient(90deg, var(--color-primary), var(--color-insight));
        }
        .comment-section {
            padding: var(--space-6) var(--space-8);
            border-bottom: 1px solid var(--color-border);
        }
        .comment-box {
            background: var(--color-surface-hover);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-primary);
            padding: var(--space-4);
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            font-style: italic;
        }
        .report-footer {
            padding: var(--space-6) var(--space-8);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }
        .sig-block { text-align: center; }
        .sig-name {
            font-size: var(--text-lg);
            font-style: italic;
            padding-bottom: var(--space-1);
            border-bottom: 2px solid var(--color-text-primary);
            margin-bottom: var(--space-1);
            min-width: 160px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 60px;
        }
        .sig-label {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .footer-stamp {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            text-align: right;
            line-height: 1.8;
        }
        @media print {
            .report-toolbar, .meta-bar, .report-nav { display: none !important; }
            body { background: white; }
            .reports-wrapper { padding: 0; max-width: none; }
            .report-card { box-shadow: none; margin-bottom: 0; border: none; border-top: 1px solid #ddd; }
            .report-card:first-child { border-top: none; }
        }
    </style>
</head>

<body>

    <div class="report-toolbar" id="toolbar">
        <div class="toolbar-left">
            <img src="{{ url_for('static', filename='snapreport_logo.png') }}" alt="SnapReport">
            <h1>SnapReport</h1>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-ghost btn-sm" style="color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2);" onclick="window.location='/'">← Back</button>
            <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print All</button>
        </div>
    </div>

    <div class="meta-bar" id="metaBar">
        <div class="meta-item">School: <strong id="metaSchool">—</strong></div>
        <div class="meta-item">Template: <strong id="metaTemplate">—</strong></div>
        <div class="meta-item">Term: <strong id="metaTerm">—</strong></div>
        <div class="meta-item">Students: <strong id="metaCount">—</strong></div>
        <div class="meta-item">Generated: <strong id="metaDate">—</strong></div>
    </div>

    <div class="report-nav" id="reportNav"></div>

    <div class="reports-wrapper" id="reportsWrapper">
        <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading Reports...</span>
        </div>
    </div>

    <script>
        /*
         * DYNAMIC REPORT VIEWER
         *
         * Reads student data from sessionStorage and dynamically
         * renders report cards matching the EXACT original format.
         * Works with ANY template fields — no hardcoded field names.
         *
         * Expected sessionStorage 'reportData' shape:
         * {
         *   students: [ { "Field Name": value, ..., _total, _grade, _remark, _position } ],
         *   meta: { school_name, term, year, template_name, total_students, score_fields, generated_at }
         * }
         */

        function gradeClass(g) {
            if (!g) return 'grade-N/A';
            const first = String(g).charAt(0).toUpperCase();
            return 'grade-' + (first === 'N' ? 'N\\/A' : first);
        }

        /**
         * Classify student fields into info, score, and comment groups.
         */
        function classifyFields(student, meta) {
            const scoreFields = meta.score_fields || [];
            const infoFields = [];
            const commentFields = [];
            let nameField = null;

            for (const key of Object.keys(student)) {
                if (key.startsWith('_')) continue;
                if (scoreFields.includes(key)) continue;

                const lower = key.toLowerCase();
                if (lower.includes('comment') || lower.includes('remark') || lower.includes('note') || lower.includes('observation')) {
                    commentFields.push(key);
                } else {
                    infoFields.push(key);
                }
            }

            // Always put the name field first in infoFields
            for (let i = 0; i < infoFields.length; i++) {
                const lower = infoFields[i].toLowerCase();
                if (lower.includes('name') || lower.includes('student')) {
                    nameField = infoFields.splice(i, 1)[0];
                    break;
                }
            }
            if (nameField) {
                infoFields.unshift(nameField);
            }

            return { infoFields, scoreFields, commentFields };
        }

        /**
         * Build a single student info row.
         */
        function buildInfoRow(label, value) {
            const isRegNo = label.toLowerCase().includes('reg') || label.toLowerCase().includes('number') || label.toLowerCase().includes('id');
            const valueClass = isRegNo ? 'info-value reg-mono' : 'info-value';
            return `
                <div class="info-row">
                    <span class="info-label">${label}</span>
                    <span class="${valueClass}">${value || '—'}</span>
                </div>`;
        }

        /**
         * Build grade pill with color coding.
         */
        function buildGradePill(grade, remark) {
            const g = String(grade || '').trim();
            const first = g.charAt(0).toUpperCase();
            const cls = 'grade-' + (first === 'N' ? 'N\\/A' : first);
            return `<span class="grade-pill ${cls}"><strong>${g}</strong> — ${remark || ''}</span>`;
        }

        /**
         * Build one complete report card — EXACT original format.
         *
         * Original format (before changes):
         *   1. Accent bar (gradient)
         *   2. Header: school name + term/year left, BOTH logos right (SnapReport + Netzah)
         *   3. Student info: 2-column grid
         *   4. Scores: 3-column grid + grade pill + progress bar
         *   5. Comment section
         *   6. Footer: signature image + label left, school stamp right
         *
         * Now with dynamic fields instead of hardcoded values.
         */
        function buildReport(student, meta, fieldInfo) {
            const { infoFields, scoreFields, commentFields } = fieldInfo;
            const total = student._total || 0;
            const grade = student._grade || '';
            const remark = student._remark || '';
            const pct = Math.min(100, Math.round(total));

            // --- Student Info Section (2-column grid, same layout) ---
            const halfIdx = Math.ceil(infoFields.length / 2);
            const leftFields = infoFields.slice(0, halfIdx);
            const rightFields = infoFields.slice(halfIdx);

            const leftBlock = leftFields.map(f =>
                buildInfoRow(f, student[f])
            ).join('');

            let rightBlock = rightFields.map(f =>
                buildInfoRow(f, student[f])
            ).join('');
            rightBlock += buildInfoRow('Grade', grade);
            rightBlock += buildInfoRow('Academic Year', meta.year);

            const studentSection = `
                <div class="student-section">
                    <div class="info-block">${leftBlock}</div>
                    <div class="info-block">${rightBlock}</div>
                </div>`;

            // --- Scores Section (dynamic, same 3-column layout) ---
            const allScores = [...scoreFields];
            if (allScores.length > 0 && total > 0) {
                allScores.push('__total__');
            }
            const gridCols = allScores.length <= 1 ? 'cols-1' : allScores.length === 2 ? 'cols-2' : '';
            const topColors = ['score-field-0', 'score-field-1', 'score-field-2', 'score-field-3', 'score-field-4'];

            const scoreBoxes = allScores.map((sf, i) => {
                if (sf === '__total__') {
                    return `
                        <div class="score-box score-total">
                            <div class="score-label">Total Score</div>
                            <div class="score-value">${total}</div>
                            <div class="score-sub">out of ${scoreFields.length * 100}</div>
                        </div>`;
                }
                const val = student[sf] || 0;
                const colorClass = topColors[i % topColors.length];
                return `
                    <div class="score-box ${colorClass}">
                        <div class="score-label">${sf}</div>
                        <div class="score-value">${val}</div>
                        <div class="score-sub">marks</div>
                    </div>`;
            }).join('');

            const scoresSection = scoreFields.length > 0 ? `
                <div class="scores-section">
                    <div class="section-title">Performance Summary</div>
                    <div class="scores-grid ${gridCols}">
                        ${scoreBoxes}
                    </div>
                    <div class="grade-row">
                        ${buildGradePill(grade, remark)}
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${pct}%"></div>
                    </div>
                </div>` : `
                <div class="scores-section">
                    <div class="section-title">Summary</div>
                    <div class="grade-row">
                        ${buildGradePill(grade, remark)}
                    </div>
                </div>`;

            // --- Comment Section ---
            let commentSection = '';
            for (const cf of commentFields) {
                const val = student[cf];
                if (val && String(val).trim()) {
                    commentSection += `
                        <div class="comment-section">
                            <div class="section-title">${cf}</div>
                            <div class="comment-box">${val}</div>
                        </div>`;
                }
            }

            // --- Determine student name for the card ID ---
            let studentName = 'Student Report';
            if (infoFields.length > 0) {
                const firstName = student[infoFields[0]];
                if (firstName) studentName = firstName;
            }

            // --- Assemble full card (EXACT original format) ---
            return `
            <div class="report-card" id="report-${String(studentName).replace(/\s+/g, '_')}">
                <div class="report-accent"></div>

                <div class="report-header">
                    <div class="school-info">
                        <h2>${meta.school_name}</h2>
                        <p>${meta.term} ${meta.year}</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: var(--space-4);">
                        <img src="/static/icrp_logo.png" alt="ICRP" style="height: 48px; width: auto;">
                        <img src="/static/netzah.jpeg" alt="Netzah" style="height: 48px; width: auto; object-fit: contain;">
                    </div>
                </div>

                ${studentSection}
                ${scoresSection}
                ${commentSection}

                <div class="report-footer">
                    <div class="sig-block">
                        <div class="sig-name">
                            <img src="/static/sign.png" alt="Signature" style="max-height: 60px; width: auto; object-fit: contain;">
                        </div>
                        <div class="sig-label">TECHNICAL REPRESENTATIVE</div>
                    </div>
                    <div class="footer-stamp">
                        ${meta.school_name} · ${meta.term} ${meta.year}
                    </div>
                </div>
            </div>`;
        }

        function init() {
            const raw = sessionStorage.getItem('reportData');
            if (!raw) {
                document.getElementById('reportsWrapper').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <h3>No Report Data Found</h3>
                    <p>Please go back and upload an Excel or CSV file first.</p>
                    <a href="/" class="btn btn-primary">← Back to Home</a>
                </div>`;
                document.getElementById('metaBar').style.display = 'none';
                document.getElementById('reportNav').style.display = 'none';
                return;
            }

            const data = JSON.parse(raw);
            const { students, meta } = data;

            if (!students || students.length === 0) {
                document.getElementById('reportsWrapper').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>No Students Found</h3>
                    <p>The uploaded file contained no valid student records.</p>
                    <a href="/" class="btn btn-primary">← Back to Home</a>
                </div>`;
                return;
            }

            // Classify fields from the first student
            const fieldInfo = classifyFields(students[0], meta);

            // Populate meta bar
            document.getElementById('metaSchool').textContent = meta.school_name || '—';
            document.getElementById('metaTemplate').textContent = meta.template_name || '—';
            document.getElementById('metaTerm').textContent = `${meta.term || ''} ${meta.year || ''}`;
            document.getElementById('metaCount').textContent = `${meta.total_students || students.length} students`;
            document.getElementById('metaDate').textContent = meta.generated_at || '—';

            // Build student nav tabs
            const nav = document.getElementById('reportNav');
            students.forEach((s, i) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
                const nameVal = fieldInfo.infoFields.length > 0
                    ? s[fieldInfo.infoFields[0]]
                    : `Student ${i + 1}`;
                btn.textContent = String(nameVal).split(' ')[0];
                btn.onclick = () => {
                    const id = 'report-' + String(nameVal).replace(/\s+/g, '_');
                    const el = document.getElementById(id);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                nav.appendChild(btn);
            });

            // Render all report cards
            const wrapper = document.getElementById('reportsWrapper');
            wrapper.innerHTML = students.map(s => buildReport(s, meta, fieldInfo)).join('');
        }

        init();
    </script>

</body>
</html>
